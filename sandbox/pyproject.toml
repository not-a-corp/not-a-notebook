[project]
name = "not-a-notebook-sandbox"
version = "0.1.0"
requires-python = ">=3.14"
# Everything the generated code can import. The container has no internet, so
# what is not here does not exist for it — adding a package is a change to this
# file and a new image, never a `pip install` at runtime.
dependencies = [
    "duckdb>=1.4",
    "ipykernel>=7.0",
    "matplotlib>=3.10",
    # Runs an exported notebook top to bottom: the export's promise is that it
    # runs with no edits, and this is what checks it, inside this same image.
    "nbclient>=0.10",
    # Not imported by anyone directly: plotly's plotly_mimetype renderer refuses
    # to emit a figure without it, and fig.show() would fail in every conversation.
    "nbformat>=5.10",
    "numpy>=2.3",
    "openpyxl>=3.1",
    "pandas>=2.3",
    "pdfplumber>=0.11",
    "plotly>=6.3",
    "polars>=1.34",
    "pyarrow>=21.0",
    "xlrd>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
# Only in the image's test stage; the image that runs kernels has none of it.
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No cache: the image is read-only to the user the tests run as.
addopts = "-ra -q -p no:cacheprovider"
# The modules live at /opt/sandbox/kernel in the image, on PYTHONPATH already.
