[project]
name = "not-a-notebook-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "email-validator>=2.3",
    "fastapi>=0.118",
    "httpx2>=2.13",
    "psycopg[binary,pool]>=3.2.10",
    "pydantic-settings>=2.11",
    "pyjwt>=2.10",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "ASYNC", # async pitfalls
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# The image installs dependencies without installing the project, so pytest needs
# the working directory on sys.path to import `app`.
pythonpath = ["."]
