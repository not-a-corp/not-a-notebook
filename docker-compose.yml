x-api: &api
  build:
    context: .
    dockerfile: api/Dockerfile
  environment:
    DATABASE_URL: postgresql://notebook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/notebook
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
    KERNEL_MEMORY_MB: ${KERNEL_MEMORY_MB:-2048}
    KERNEL_CPUS: ${KERNEL_CPUS:-1.0}
    EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-300}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: notebook
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images want the mount one level up, at /var/lib/postgresql,
      # so the data lands in a major-version subdirectory and pg_upgrade --link
      # does not run into a mount boundary. Mounting .../data fails to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d notebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A one-shot service rather than a step in the API's startup: one process
  # applies the revisions, so two API instances starting at once cannot race
  # each other through them.
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  # The kernel image. Conversations get their own containers from it at runtime;
  # this service exists so that `docker compose up` builds it, and proves it on
  # the way: the check starts a kernel and exits. No network at all — the check
  # needs none, and neither does anything the image is for.
  sandbox:
    build: sandbox
    image: not-a-notebook-sandbox
    command: ["python", "/opt/sandbox/check.py"]
    network_mode: none

  api:
    <<: *api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Kernels are started from this image; the API does not start until it
      # exists and has passed its check.
      sandbox:
        condition: service_completed_successfully
    volumes:
      # The API starts a container per conversation. The socket is root on the
      # host: accepted for self-host, and behind a socket proxy when hosted.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      # The image has Python and no curl.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
