<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>not-a-notebook</title>
    <script>
      // Set the theme before the first paint, so a dark page never flashes
      // white while the app loads. The app applies the same choice again
      // (src/lib/theme.ts); this copy only has to be fast.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("not-a-notebook.theme");
        } catch (error) {}
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = dark ? "dark" : "light";
        if (choice === "light" || choice === "dark" || choice === "mocha") {
          theme = choice;
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
